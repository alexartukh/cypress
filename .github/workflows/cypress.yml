name: Cypress Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:            # кнопка "Run workflow" в Actions — запуск без пуша

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # официальный action: сам делает npm ci, кэширует бинарник Cypress и запускает тесты
      # Chrome уже установлен на ubuntu-latest, браузеры ставить не нужно
      - name: Run Cypress smoke tests
        uses: cypress-io/github-action@v7
        with:
          command: npx cypress run --browser chrome --expose grepTags=@smoke,grepFilterSpecs=true

      # скриншоты упавших тестов — как артефакт (Cypress делает их сам в режиме run)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 30
